name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  smoke:
    # Boots the REAL docker image fresh, then asserts against it over HTTP:
    # app identity, rate payloads, PWA assets (manifest/sw/icons), the
    # full upload flow + offline service-worker behaviour via Playwright
    # using a tiny synthetic GreenButton XML (webapp/tests/fixtures), the
    # Wave H full-journey spec (tests/e2e/journey.spec.ts) against the
    # bundled sample export, and TWO Lighthouse budgets — desktop >= 90 and
    # mobile >= 85 with CLS <= 0.1 (Wave I).
    # No secrets; runner's preinstalled Chrome (no Playwright downloads).
    name: E2E Smoke (Docker boot, HTTP, upload flow, PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install deps (skip browser download; channel=chrome uses system Chrome)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Build image
        run: docker build -t energy-smoke .
      - name: Boot container (fresh, production build)
        run: docker run -d --rm -p 3100:3000 --name energy-smoke energy-smoke
      - name: HTTP smoke (/, /api/rates, manifest, sw.js, icons)
        run: bash tests/e2e/http_smoke.sh http://127.0.0.1:3100
      - name: Playwright smoke (upload flow, Shift Optimizer, PWA offline)
        run: npx playwright test
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3100
      # Wave H item 11 — desktop performance budget: the desktop-emulated
      # Lighthouse score for the booted production container must stay >= 90.
      - name: Lighthouse budget (desktop, performance >= 90)
        run: npx lhci autorun
      # Wave I item 4 — the phone budget, same container, Lighthouse's own
      # mobile emulation (390x844 @3x, 150 ms RTT, 1.6 Mbps, 4x CPU). Desktop
      # numbers hide everything this app does wrong on a phone, so it gets its
      # own run rather than a looser number on the desktop one.
      - name: Lighthouse mobile budget (performance >= 85, CLS <= 0.1)
        run: npx lhci autorun --config=lighthouserc.mobile.json
      - name: Lighthouse reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: webapp/lhci-reports*
          if-no-files-found: ignore
      - name: Container logs
        if: failure()
        run: docker logs energy-smoke || true
      - name: Teardown
        if: always()
        run: docker rm -f energy-smoke || true

  python:
    name: Python (Parser Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v
