# CI here is LOCAL-GATE-ONLY: trigger-less for push/PR, manual via
# workflow_dispatch. GitHub Actions minutes are exhausted on this account
# (private repo, free plan), so every push/PR run dies in 3-4s with all
# three jobs marked "failed" and ZERO steps executed — the jobs are never
# even scheduled. Those reds in the run history are billing, not test
# failures; don't triage them.
#
# The real gate is local (see OPERATIONS.md "Deploying changes"):
#   webapp: npm run lint && npm run typecheck && npm run test && npm run build
#   root:   pytest tests/ -v          (when the parser layer changed)
#   smoke:  docker build + tests/e2e  (see README "Development")
#
# To re-enable: restore the push/pull_request triggers below and run
# `gh workflow enable CI` (the workflow is also disabled server-side so
# the Actions tab doesn't advertise a gate that can't run).
name: CI

on:
  workflow_dispatch:  # manual only — push/PR triggers removed 2026-10-10 (billing dead)

jobs:
  frontend:
    name: Frontend (Lint, Typecheck, Test, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  smoke:
    # Boots the REAL docker image fresh, then asserts against it over HTTP:
    # app identity, rate payloads, PWA assets (manifest/sw/icons), the
    # full upload flow + offline service-worker behaviour via Playwright
    # using a tiny synthetic GreenButton XML (webapp/tests/fixtures), the
    # Wave H full-journey spec (tests/e2e/journey.spec.ts) against the
    # bundled sample export, the Wave N account gate in both states (feature
    # off / on, tests/e2e/account_smoke.sh), and TWO Lighthouse budgets —
    # desktop >= 90 and mobile >= 85 with CLS <= 0.1 (Wave I).
    # No secrets; runner's preinstalled Chrome (no Playwright downloads).
    name: E2E Smoke (Docker boot, HTTP, upload flow, PWA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - name: Install deps (skip browser download; channel=chrome uses system Chrome)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Build image
        run: docker build -t energy-smoke .
      - name: Boot container (fresh, production build)
        run: docker run -d --rm -p 3100:3000 --name energy-smoke energy-smoke
      - name: HTTP smoke (/, /api/rates, manifest, sw.js, icons)
        run: bash tests/e2e/http_smoke.sh http://127.0.0.1:3100
      # Wave N — both halves of the account ship criterion, over real HTTP:
      # the public app carries NO ACCT_* env, so every /account/* route must
      # 404 (the feature is invisible, not broken), and the same image booted
      # with ACCT_ENABLED=true must complete register → login → PUT sync →
      # a second profile → GET sync → stale-rev 409 → logout invalidation.
      - name: Account gate (feature OFF — the public app is unchanged)
        run: bash tests/e2e/account_smoke.sh http://127.0.0.1:3100 --expect-disabled
      - name: Boot the account-server behind the edge (the ON gate needs both)
        # Measured on hermescomputer 2026-11-09 against the image of this
        # tree: the bare `docker run` was red for TWO independent reasons.
        #  1. BOOT — since 28af5e4 the instrumentation hook runs
        #     assertAccountDataDir, so ACCT_DATA_DIR_HOST/ACCT_REPO_HOST_DIR
        #     must be absolute with the data dir OUTSIDE the checkout, and the
        #     mounted /data must be uid 1001 (the container user) and mode
        #     0700-or-stricter — the old `mode=1777` tmpfs fails that check
        #     outright, and without the env pair every request 500s before the
        #     readiness loop exhausts its 30s. This container has no host
        #     checkout to name, so the pair names the container's own paths
        #     (/data sits outside /app); every filesystem check the loader
        #     makes runs against the mounted /data, which the uid/gid/mode
        #     tmpfs below satisfies. ACCT_DATA_DIR mirrors the compose file.
        #  2. X-Edge-Location — that header is set ONLY by the edge
        #     (ops/edge/default.conf.template). The gate's identity cell pairs
        #     it with x-gb-process, so a bare container can never pass, and
        #     the script paces its matrix for nginx's 60r/m account limiter on
        #     purpose: it was written to run behind the edge, exactly as the
        #     topology gate does. So this leg boots the same edge template in
        #     front; the app container from the OFF leg stays up and answers
        #     "/" through it (readiness probe + default location), as in
        #     production. /greenbutton locations are never requested here, so
        #     the unreferenced shim upstream is never resolved.
        run: |
          docker network create energy-smoke-net
          docker network connect --alias energy-dashboard energy-smoke-net energy-smoke
          docker run -d --rm --network energy-smoke-net --network-alias account-server --name energy-account-smoke \
            --tmpfs /data:rw,noexec,nosuid,nodev,size=65536k,uid=1001,gid=1001,mode=0700 \
            -e ACCT_ENABLED=true -e ACCT_DATA_DIR=/data -e ACCT_DATA_DIR_HOST=/data \
            -e ACCT_REPO_HOST_DIR=/app -e ACCT_DB_PATH=/data/accounts.db \
            energy-smoke
          docker build -t energy-edge ../ops/edge
          docker run -d --rm --network energy-smoke-net -p 3101:80 -e XFP=http --name energy-edge energy-edge
      - name: Account gate (feature ON — register → sync → second device → logout)
        run: bash tests/e2e/account_smoke.sh http://127.0.0.1:3101
      - name: Playwright smoke (upload flow, Shift Optimizer, PWA offline)
        run: npx playwright test
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3100
      # Wave H item 11 — desktop performance budget: the desktop-emulated
      # Lighthouse score for the booted production container must stay >= 90.
      - name: Lighthouse budget (desktop, performance >= 90)
        run: npx lhci autorun
      # Wave I item 4 — the phone budget, same container, Lighthouse's own
      # mobile emulation (390x844 @3x, 150 ms RTT, 1.6 Mbps, 4x CPU). Desktop
      # numbers hide everything this app does wrong on a phone, so it gets its
      # own run rather than a looser number on the desktop one.
      - name: Lighthouse mobile budget (performance >= 85, CLS <= 0.1)
        run: npx lhci autorun --config=lighthouserc.mobile.json
      # lhci only prints failures, so a green run is an opaque check. Echo the
      # two numbers the budget is actually about, so a later regression shows
      # up in the log as a moving number and not just "it used to pass".
      - name: Report the mobile numbers
        if: success()
        run: node -e "const fs=require('fs');const f=fs.readdirSync('lhci-reports-mobile').find(x=>x.endsWith('.report.json'));const j=JSON.parse(fs.readFileSync('lhci-reports-mobile/'+f,'utf8'));const lhr=j.lhr||j;console.log('mobile performance',lhr.categories.performance.score,'| CLS',lhr.audits['cumulative-layout-shift'].numericValue,'| LCP',Math.round(lhr.audits['largest-contentful-paint'].numericValue),'ms | TBT',Math.round(lhr.audits['total-blocking-time'].numericValue),'ms')" || true
      - name: Lighthouse reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: webapp/lhci-reports*
          if-no-files-found: ignore
      - name: Container logs
        if: failure()
        run: |
          docker logs energy-smoke || true
          docker logs energy-account-smoke || true
          docker logs energy-edge || true
      - name: Teardown
        if: always()
        run: |
          docker rm -f energy-smoke energy-account-smoke energy-edge || true
          docker network rm energy-smoke-net || true

  python:
    name: Python (Parser Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/ -v
