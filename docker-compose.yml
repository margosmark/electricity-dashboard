services:
  # ------------------------------------------------------------------
  # electricity.markarslan.ca on .110 — four containers, one host port.
  #
  #   edge-router :3939  →  /greenbutton*        → greenbutton-shim
  #                        /account/*            → account-server   (Wave N)
  #                        /account/internal/*   → denied at the edge
  #                        everything else       → energy-dashboard
  #
  # The upstream edge forwards every path of the domain to this host's port
  # 3939 (measured: see GREENBUTTON-CMD.md §5), so the path split lives in
  # the router below. The shim is its OWN container: it is the only service
  # that sees GB_CLIENT_ID / GB_CLIENT_SECRET, the only one with the token
  # file mounted, and the only one behind the /greenbutton/* prefix.
  # ------------------------------------------------------------------

  # The public dashboard. No Green Button environment, no token mount, and
  # no ACCT_*/VAPID_* either — if a request ever reaches it on /greenbutton/*
  # it answers configured:false and can leak nothing, and a request on
  # /account/* answers 404, because it holds no secrets at all.
  energy-dashboard:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    image: electricity-dashboard-energy-dashboard:latest
    container_name: energy-dashboard
    restart: always
    expose:
      - "3000"

  # The shim. Same image (the shim is six route handlers in this app), but a
  # separate process with its own secrets. Never published on the host —
  # only edge-router can reach it, only on the /greenbutton/* prefix.
  greenbutton-shim:
    image: electricity-dashboard-energy-dashboard:latest
    container_name: greenbutton-shim
    restart: always
    expose:
      - "3000"
    environment:
      # Inert until GB_CLIENT_ID / GB_CLIENT_SECRET are issued by Oakville
      # Hydro: /greenbutton/status then reports configured=false and the
      # toolbar renders nothing. See GREENBUTTON-CMD.md.
      GB_PUBLIC_ORIGIN: https://electricity.markarslan.ca
      GB_REDIRECT_URI: https://electricity.markarslan.ca/greenbutton/callback
      GB_SCOPE: ${GB_SCOPE:-FB=1_3_4_5}
      # Notification URI path token. PINNED, not derived: the form records
      # this URL BEFORE Oakville issues the client secret, and a
      # secret-derived default would change the moment credentials arrive,
      # invalidating what is on file. Regenerating it breaks notifications.
      # It is deliberately NOT given a default in this file: the value is
      # deploy state, not source, so it lives in the untracked .env next to
      # GB_TOKEN_DIR (see OPERATIONS.md). `:?` fails the deploy loudly
      # rather than silently falling back to a derived token.
      GB_NOTIFY_TOKEN: ${GB_NOTIFY_TOKEN:?set GB_NOTIFY_TOKEN in the untracked .env - see OPERATIONS.md}
      # The ONLY file the shim writes: the OAuth token set, mode 0600,
      # outside the container. Owner must be uid 1001 (the `nextjs` user).
      GB_TOKEN_FILE: /var/lib/greenbutton/tokens.json
      GB_CLIENT_ID: ${GB_CLIENT_ID:-}
      GB_CLIENT_SECRET: ${GB_CLIENT_SECRET:-}
      # Wave N: when Oakville says new data exists, tell the account server
      # so subscribers get a push. The shim holds scalars only (see
      # lib/greenbutton/session.ts) — this payload says "changed at 09:11",
      # never a reading. Both are absent ⇒ the call is skipped entirely.
      ACCT_NOTIFY_URL: ${ACCT_NOTIFY_URL:-http://account-server:3000/account/internal/notify}
      ACCT_INTERNAL_TOKEN: ${ACCT_INTERNAL_TOKEN:-}
      # PKCE (RFC 7636, S256): implemented end to end, OFF until Oakville
      # Hydro confirms the London-Hydro platform accepts code_challenge.
      # Flip with GB_PKCE=true in the untracked .env.
      GB_PKCE: ${GB_PKCE:-false}
    volumes:
      # Host path is a DEPLOY decision, pinned in the untracked `.env`
      # (GB_TOKEN_DIR=/home/hermes/.greenbutton-shim on .110) so the token
      # file never lands inside the git worktree. The default below is the
      # local-dev path only.
      - ${GB_TOKEN_DIR:-./.greenbutton}:/var/lib/greenbutton


  # Wave N: the account server. Same image as everything else, different
  # process — the ONLY container that sees ACCT_* (argon2 password verifiers,
  # session rows, the SQLite file) and VAPID_* (the push signing key). The
  # public app gets neither, which is the whole reason this is a separate
  # service rather than a set of routes in `energy-dashboard`.
  #
  # Off by default: `ACCT_ENABLED` is absent from `energy-dashboard`, so its
  # `/account/*` handlers answer 404 and the site is byte-identical to
  # pre-Wave-N. Set ACCT_ENABLED=true here (and VAPID_* to turn on push) to
  # switch the feature on.
  account-server:
    image: electricity-dashboard-energy-dashboard:latest
    container_name: account-server
    restart: always
    expose:
      - "3000"
    environment:
      ACCT_ENABLED: ${ACCT_ENABLED:-true}
      ACCT_DB_PATH: /data/accounts.db
      ACCT_PUBLIC_ORIGIN: https://electricity.markarslan.ca
      # Shared with greenbutton-shim for the data_available fan-out. The
      # shim never sees the database; this token only lets it say
      # "something changed". Denied at the edge (ops/edge/default.conf.template).
      ACCT_INTERNAL_TOKEN: ${ACCT_INTERNAL_TOKEN:-}
      ACCT_RATES_URL: http://energy-dashboard:3000/api/rates
      ACCT_MAX_ACCOUNTS: ${ACCT_MAX_ACCOUNTS:-10}
      # Push is optional: without these three the account server still runs
      # sync and reports pushConfigured:false instead of failing to boot.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:mark@markarslan.ca}
    volumes:
      # accounts.db is user data (ciphertext, but still theirs) — see the
      # backup story in OPERATIONS.md.
      - ${ACCT_DATA_DIR:-./.account}:/data
    depends_on:
      - energy-dashboard

  # Path split. Holds no application code and no secrets; it only decides
  # which of the two containers answers. XFP = the scheme the edge saw.
  #
  # The template is BAKEN INTO THE IMAGE (ops/edge/Dockerfile), not mounted,
  # so changing it changes the image ID and `docker compose up -d --build`
  # recreates the router. A bind mount would let a config edit sit on disk
  # while the running nginx keeps the old policy. Upstream freshness is
  # handled separately, inside the config (per-request DNS resolution).
  edge-router:
    build:
      context: ./ops/edge
      dockerfile: Dockerfile
    image: electricity-dashboard-edge-router:latest
    container_name: edge-router
    restart: always
    ports:
      - "3939:80"
    # Rotation for THIS container's log, pinned in the repo rather than
    # inherited from the host daemon: it is the access log the OAuth
    # callback query string used to land in, and an unbounded json file on
    # a shared box is not a place to grow token material. The host default
    # (/etc/docker/daemon.json on .110) covers everything else.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      XFP: ${GB_EDGE_XFP:-https}
    depends_on:
      - energy-dashboard
      - greenbutton-shim
      - account-server
