services:
  energy-dashboard:
    build:
      context: ./webapp
      dockerfile: Dockerfile
    container_name: energy-dashboard
    ports:
      - "3939:3000"
    restart: always
    environment:
      # --- Green Button CMD shim (Wave K) ---------------------------------
      # Inert until GB_CLIENT_ID / GB_CLIENT_SECRET are issued by Oakville
      # Hydro: /greenbutton/status then reports configured=false and the
      # toolbar renders nothing. See docs/GREENBUTTON-CMD.md.
      GB_PUBLIC_ORIGIN: https://electricity.markarslan.ca
      GB_REDIRECT_URI: https://electricity.markarslan.ca/greenbutton/callback
      GB_SCOPE: ${GB_SCOPE:-FB=1_3_4_5}
      # The ONLY file the shim writes: the OAuth token set, mode 0600,
      # outside the container. Owner must be uid 1001 (the `nextjs` user).
      GB_TOKEN_FILE: /var/lib/greenbutton/tokens.json
      GB_CLIENT_ID: ${GB_CLIENT_ID:-}
      GB_CLIENT_SECRET: ${GB_CLIENT_SECRET:-}
    volumes:
      - ${GB_TOKEN_DIR:-./.greenbutton}:/var/lib/greenbutton
